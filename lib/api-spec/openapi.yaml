openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JJK RPG Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: player
  - name: characters
  - name: shop
  - name: inventory
  - name: daily
  - name: missions
  - name: leaderboards
  - name: casino
  - name: marketplace
  - name: notifications
  - name: transactions
  - name: announcements
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────
  /auth/telegram:
    post:
      operationId: telegramLogin
      tags: [auth]
      summary: Login via Telegram OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid Telegram data

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated player
      responses:
        "200":
          description: Current player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── PLAYER ────────────────────────────────────────
  /players/me:
    get:
      operationId: getMyPlayer
      tags: [player]
      summary: Get current player full data
      responses:
        "200":
          description: Player data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          description: Not authenticated

  /players/me/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [player]
      summary: Get dashboard home summary (stats, activity, online count)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /players/me/profile:
    patch:
      operationId: updateMyProfile
      tags: [player]
      summary: Update player profile (avatar, banner, title, badge, frame, theme)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{userId}:
    get:
      operationId: getPlayer
      tags: [player]
      summary: Get public player profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlayer"
        "404":
          description: Player not found

  /players/me/character:
    post:
      operationId: equipCharacter
      tags: [player]
      summary: Equip a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipCharacterInput"
      responses:
        "200":
          description: Character equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  # ── CHARACTERS ────────────────────────────────────
  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List all characters
      responses:
        "200":
          description: Characters list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"

  /characters/{id}:
    get:
      operationId: getCharacter
      tags: [characters]
      summary: Get character by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found

  # ── SHOP ──────────────────────────────────────────
  /shop/items:
    get:
      operationId: listShopItems
      tags: [shop]
      summary: List all in-game shop items
      responses:
        "200":
          description: Shop items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopItem"

  /shop/packs:
    get:
      operationId: listPremiumPacks
      tags: [shop]
      summary: List premium yen/elixir/bundle packs for real-money purchase
      responses:
        "200":
          description: Premium packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PremiumPack"

  /shop/purchase:
    post:
      operationId: purchaseShopItem
      tags: [shop]
      summary: Purchase a shop item with Yen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Purchase successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResult"
        "400":
          description: Insufficient funds or invalid item

  # ── INVENTORY ─────────────────────────────────────
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: Get current player inventory
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/{itemId}/use:
    post:
      operationId: useItem
      tags: [inventory]
      summary: Use a consumable item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Item used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseItemResult"
        "400":
          description: Cannot use item

  /inventory/{itemId}/equip:
    post:
      operationId: equipItem
      tags: [inventory]
      summary: Equip a weapon or artifact
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Item equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseItemResult"

  /inventory/{itemId}/sell:
    delete:
      operationId: sellItem
      tags: [inventory]
      summary: Sell an item for Yen
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Item sold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellItemResult"
        "404":
          description: Item not in inventory

  # ── DAILY ─────────────────────────────────────────
  /daily/status:
    get:
      operationId: getDailyStatus
      tags: [daily]
      summary: Get daily reward status (claimed, next claim time, streak)
      responses:
        "200":
          description: Daily status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStatus"

  /daily/claim:
    post:
      operationId: claimDaily
      tags: [daily]
      summary: Claim daily reward
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReward"
        "400":
          description: Already claimed today

  # ── MISSIONS ──────────────────────────────────────
  /missions/daily:
    get:
      operationId: listDailyMissions
      tags: [missions]
      summary: Get today's daily missions
      responses:
        "200":
          description: Daily missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mission"

  # ── LEADERBOARDS ──────────────────────────────────
  /leaderboards/level:
    get:
      operationId: getLevelLeaderboard
      tags: [leaderboards]
      summary: Top players by level
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/wealth:
    get:
      operationId: getWealthLeaderboard
      tags: [leaderboards]
      summary: Richest players by Yen
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/pvp:
    get:
      operationId: getPvpLeaderboard
      tags: [leaderboards]
      summary: Top players by PvP wins
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # ── CASINO ────────────────────────────────────────
  /casino/coinflip:
    post:
      operationId: playCoinFlip
      tags: [casino]
      summary: Play coin flip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinFlipInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoResult"

  /casino/dice:
    post:
      operationId: playDice
      tags: [casino]
      summary: Play dice roll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasinoInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoResult"

  /casino/slots:
    post:
      operationId: playSlots
      tags: [casino]
      summary: Play slot machine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasinoInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoResult"

  /casino/roulette:
    post:
      operationId: playRoulette
      tags: [casino]
      summary: Play roulette
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouletteInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoResult"

  /casino/crash:
    post:
      operationId: playCrash
      tags: [casino]
      summary: Play crash game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasinoInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoResult"

  /casino/stats:
    get:
      operationId: getCasinoStats
      tags: [casino]
      summary: Get player casino statistics
      responses:
        "200":
          description: Casino stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoStats"

  # ── MARKETPLACE ───────────────────────────────────
  /marketplace/listings:
    get:
      operationId: listMarketplace
      tags: [marketplace]
      summary: Get all active marketplace listings
      parameters:
        - name: type
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceListing"

    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"

  /marketplace/listings/{id}:
    delete:
      operationId: deleteListing
      tags: [marketplace]
      summary: Remove a marketplace listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /marketplace/listings/{id}/buy:
    post:
      operationId: buyListing
      tags: [marketplace]
      summary: Buy a marketplace listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResult"

  # ── NOTIFICATIONS ─────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get player notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── TRANSACTIONS ──────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: Get player transaction history
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/manual:
    post:
      operationId: createManualPurchase
      tags: [transactions]
      summary: Request a manual Yen purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualPurchaseInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPurchase"

  /transactions/manual/list:
    get:
      operationId: listManualPurchases
      tags: [transactions]
      summary: Get player manual purchase requests
      responses:
        "200":
          description: Manual purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualPurchase"

  # ── ANNOUNCEMENTS ─────────────────────────────────
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: Get game announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"

  # ── ADMIN ─────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all players (admin)
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/users/{userId}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update player data (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /admin/grants:
    post:
      operationId: adminGrant
      tags: [admin]
      summary: Grant items or currency to a player (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantInput"
      responses:
        "200":
          description: Grant applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantResult"

  /admin/announcements:
    post:
      operationId: adminCreateAnnouncement
      tags: [admin]
      summary: Create an announcement (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /admin/transactions:
    get:
      operationId: adminListTransactions
      tags: [admin]
      summary: List all transactions (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /admin/transactions/{id}:
    patch:
      operationId: adminUpdateTransaction
      tags: [admin]
      summary: Update transaction status (admin) — approve manual purchases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get dashboard analytics (admin)
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /admin/logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: Get admin audit logs
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: ["string", "null"]

    # ── AUTH ──────────────────────────────────────────
    TelegramAuthInput:
      type: object
      required: [id, first_name, auth_date, hash]
      properties:
        id:
          type: number
        first_name:
          type: string
        last_name:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        auth_date:
          type: number
        hash:
          type: string

    AuthResult:
      type: object
      required: [token, player]
      properties:
        token:
          type: string
        player:
          $ref: "#/components/schemas/Player"

    # ── PLAYER ────────────────────────────────────────
    Player:
      type: object
      required: [user_id, username, display_name, level, xp, xp_needed, rank, yen, hp, max_hp, cursed_energy, max_cursed_energy, attack, defense, speed, wins, losses, win_rate]
      properties:
        user_id:
          type: number
        username:
          type: ["string", "null"]
        display_name:
          type: string
        character_id:
          type: ["integer", "null"]
        level:
          type: number
        xp:
          type: number
        xp_needed:
          type: number
        rank:
          type: string
        yen:
          type: number
        hp:
          type: number
        max_hp:
          type: number
        cursed_energy:
          type: number
        max_cursed_energy:
          type: number
        attack:
          type: number
        defense:
          type: number
        speed:
          type: number
        wins:
          type: number
        losses:
          type: number
        win_rate:
          type: number
        techniques:
          type: array
          items:
            type: string
        inventory:
          type: array
          items:
            type: number
        last_daily:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        # Extended dashboard profile fields
        avatar_url:
          type: ["string", "null"]
        banner_url:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        equipped_title:
          type: ["string", "null"]
        equipped_badge:
          type: ["string", "null"]
        equipped_frame:
          type: ["string", "null"]
        theme:
          type: ["string", "null"]
        is_banned:
          type: boolean
        is_admin:
          type: boolean
        elixirs:
          type: number
        domain_name:
          type: ["string", "null"]
        domain_power:
          type: ["integer", "null"]
        domain_equipped:
          type: boolean

    PublicPlayer:
      type: object
      required: [user_id, display_name, level, rank, wins, losses, win_rate]
      properties:
        user_id:
          type: number
        display_name:
          type: string
        username:
          type: ["string", "null"]
        character_id:
          type: ["integer", "null"]
        level:
          type: number
        rank:
          type: string
        wins:
          type: number
        losses:
          type: number
        win_rate:
          type: number
        avatar_url:
          type: ["string", "null"]
        equipped_title:
          type: ["string", "null"]

    ProfileUpdate:
      type: object
      properties:
        avatar_url:
          type: ["string", "null"]
        banner_url:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        equipped_title:
          type: ["string", "null"]
        equipped_badge:
          type: ["string", "null"]
        equipped_frame:
          type: ["string", "null"]
        theme:
          type: ["string", "null"]

    DashboardSummary:
      type: object
      required: [player, online_count, recent_activity, announcements]
      properties:
        player:
          $ref: "#/components/schemas/Player"
        online_count:
          type: number
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        announcements:
          type: array
          items:
